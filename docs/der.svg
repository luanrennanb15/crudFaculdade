    </filter>
  </defs>

  <!-- ============ LIGAcAO quartos.id 1 --- N reservas.quarto_id ============ -->
  <g stroke="#9aa5b1" stroke-width="1.4" fill="none">
    <path d="M 340 217 L 400 217 L 400 137 L 512 137"/>
  </g>
  <!-- marca "1" no lado quartos -->
  <g stroke="#9aa5b1" stroke-width="1.4">
    <line x1="348" y1="210" x2="348" y2="224"/>
  </g>
  <!-- pe-de-galinha (N) no lado reservas -->
  <g stroke="#9aa5b1" stroke-width="1.4" fill="none">
    <path d="M 512 137 L 500 129"/>
    <path d="M 512 137 L 500 137"/>
    <path d="M 512 137 L 500 145"/>
  </g>

