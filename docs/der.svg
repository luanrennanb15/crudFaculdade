  <text x="536" y="291" fill="#1a202c" font-size="13">status</text>
  <text x="772" y="291" fill="#4a5568" font-size="12" text-anchor="end">TEXT</text>
  <rect x="780" y="281" width="26" height="14" rx="2" fill="#dfe4ea"/>
  <text x="793" y="292" fill="#3d4852" font-size="9.5" font-weight="700" text-anchor="middle">NN</text>
