<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <rect width="880" height="460" fill="#fafafa"/>

  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
