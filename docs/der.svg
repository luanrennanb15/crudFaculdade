  <text x="772" y="351" fill="#4a5568" font-size="12" text-anchor="end">TEXT</text>
  <rect x="780" y="341" width="26" height="14" rx="2" fill="#dfe4ea"/>
  <text x="793" y="352" fill="#3d4852" font-size="9.5" font-weight="700" text-anchor="middle">NN</text>

  <!-- ==================== LEGENDA ==================== -->
  <text x="40" y="410" fill="#4a5568" font-size="11.5">🔑 chave primária    🔗 chave estrangeira    ◈ único    NN not null    U unique</text>
  <text x="40" y="430" fill="#4a5568" font-size="11.5">Cardinalidade: um quarto (1) possui N reservas · uma reserva pertence a exatamente um quarto</text>

