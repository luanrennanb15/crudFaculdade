  <rect x="780" y="251" width="26" height="14" rx="2" fill="#dfe4ea"/>
  <text x="793" y="262" fill="#3d4852" font-size="9.5" font-weight="700" text-anchor="middle">NN</text>
  <line x1="520" y1="272" x2="840" y2="272" stroke="#edf0f3" stroke-width="1"/>

